<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Los 2 Patitos</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" href="cart.css">
</head>
<body>
    <div class="cart-page-container">
        <div class="cart-page-header">
            <h1>🛒 Carrito de Pedido</h1>
            <a href="index.html" class="back-button">← Volver al Catálogo</a>
        </div>

        <div class="cart-page-content">
            <div id="cartContent">
                <p class="empty-cart">Cargando carrito...</p>
            </div>
        </div>

        <div class="cart-page-footer">
            <div class="customer-info">
                <label for="customerName">Tu Nombre:</label>
                <input type="text" id="customerName" placeholder="Ingresa tu nombre" maxlength="50">
            </div>
            <div class="order-buttons">                <button class="download-html-button" id="downloadHTML">
                    📄 Descargar HTML
                </button>
                <button class="whatsapp-button-large" id="sendWhatsApp" disabled>
                    📱 Enviar Pedido por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script src="cart.js"></script>
</body>
</html>
